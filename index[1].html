<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PurposePay</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f7a4f">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PurposePay">
<style>
:root{--bg:#f5f3ee;--panel:#fff;--ink:#1d2a24;--mute:#5f6d66;--line:#dcd8cd;--accent:#0f7a4f;--on:#fff;--bad:#b3261e;--ok:#0f7a4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a15;--panel:#18251e;--ink:#e8efea;--mute:#98a8a0;--line:#2b3d33;--accent:#4cc88e;--on:#06231a;--bad:#ff8a80;--ok:#4cc88e}}
:root[data-theme="dark"]{--bg:#101a15;--panel:#18251e;--ink:#e8efea;--mute:#98a8a0;--line:#2b3d33;--accent:#4cc88e;--on:#06231a;--bad:#ff8a80;--ok:#4cc88e}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:460px;margin:0 auto;padding:12px 14px 96px}
header{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 10px}
h1{font-size:18px;margin:0}h2{font-size:15px;margin:12px 0 6px}
.sub{color:var(--mute);font-size:13px}
.hero{background:var(--accent);color:var(--on);border-radius:14px;padding:16px;margin-bottom:10px}
.hero .sub{color:inherit;opacity:.85}.big{font-size:32px;font-weight:700;letter-spacing:-.02em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.card.ok{border-left:5px solid var(--ok)}.inc{border-left:5px solid #e0a030}
.ln{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.ln:last-child{border:0}.ln b{margin-left:auto}.bad{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tile{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 4px;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600}
.tile span{font-size:26px}.tile.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute);margin-bottom:8px}
input,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0;width:100%}
.btn{font:inherit;background:var(--accent);color:var(--on);border:0;border-radius:8px;padding:10px;font-weight:600;cursor:pointer;width:100%;margin-top:4px}
.mini{font:inherit;font-size:13px;background:none;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
.mini.pri{background:var(--accent);color:var(--on);border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.r2{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;margin-top:8px;align-items:center}
.seg{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--line);margin:8px 0 4px}.seg i{display:block;min-width:3px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--accent)}
.bc{border-left:5px solid var(--c);background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:8px;padding:8px 10px;margin-bottom:8px;display:grid;grid-template-columns:44px 1fr auto;align-items:center}
.hd{display:inline-block;cursor:grab;touch-action:none;user-select:none;padding:4px 6px 4px 0}
.bc.drag{box-shadow:0 4px 16px rgba(0,0,0,.28)}
.ctl{grid-column:2/4;display:flex;gap:6px;margin-top:6px}
.tok{font:600 16px ui-monospace,Menlo,monospace;background:var(--bg);padding:8px;border-radius:8px;margin:8px 0}
#toast p{margin:0 0 10px;padding:8px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--ok);font-size:14px}
#toast p.bad{border-left-color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav div{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{font:inherit;font-size:11px;background:none;border:0;color:var(--mute);cursor:pointer;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:20px}nav button.on{color:var(--accent);font-weight:700}
.prodc{font:inherit;color:inherit;text-align:left;width:100%;display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer}
.pi{font-size:26px;text-align:center}.pt,.pb{display:flex;flex-direction:column}.pb{align-items:flex-end}.prodc .bar{margin:4px 0 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.actions .btn{margin:0}
.hero .bar{background:rgba(255,255,255,.3)}.hero .bar i{background:#fff}
.cardbtn{display:block;width:100%;background:none;border:0;padding:0;margin-bottom:10px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.ccard{position:relative;border-radius:14px;padding:14px;color:#fff;background:linear-gradient(135deg,#0f7a4f,#0b3d2b);min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.ccard.virt{background:linear-gradient(135deg,#6b5bd2,#2c2470)}
.ccard.frz{filter:grayscale(1);opacity:.7}
.ct,.cb{display:flex;justify-content:space-between;font-size:13px}
.cn{font:600 18px ui-monospace,Menlo,monospace;letter-spacing:.06em}
.fz{position:absolute;right:14px;top:44px;border:1px solid #fff;border-radius:6px;padding:1px 8px;font-size:12px;transform:rotate(-8deg)}
.phone{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;max-width:340px;margin:8px auto}
.ussd{background:#0d1512;color:#9df5c4;font:14px/1.45 ui-monospace,Menlo,monospace;border-radius:10px;padding:12px;min-height:150px;white-space:pre-wrap;margin:0 0 8px}
.txr{width:100%;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;color:inherit;text-align:left;cursor:pointer}
.proto{background:#e0a030;color:#1d2a24;font-size:12px;font-weight:600;text-align:center;padding:4px 8px;border-radius:8px;margin-bottom:6px}.proto:empty{display:none}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line)}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.quick button{font:inherit;font-size:11px;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.quick span{font-size:20px}
.quick.g4{grid-template-columns:repeat(4,1fr)}
.ck{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px;margin-bottom:4px}
.ck input{width:auto}
.subtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--line);padding:3px;border-radius:10px;margin:8px 0}
.subtabs button{font:inherit;font-size:12px;border:0;background:none;color:var(--ink);padding:7px 2px;border-radius:8px;cursor:pointer}
.subtabs button.on{background:var(--panel);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
summary{cursor:pointer;padding:2px 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <div id="proto" class="proto"></div>
  <header id="hdr"></header>
  <div id="toast" aria-live="polite"></div>
  <main id="view"></main>
</div>
<nav><div id="nav"></div></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s).replace(/[<>&"'`]/g,'').trim().slice(0,24);
const N=v=>'₦'+Math.round(v).toLocaleString('en-NG');
const PAL=['#0f7a4f','#e0a030','#6b5bd2','#d9534f','#3a86c8','#b05fa0','#8d6e63'];
const S={b:[['food','🍴','Food',8000],['data','📱','Data',4200],['laundry','👕','Laundry',1000],['school','🎓','School',1500],['personal','👤','Personal',800],['elec','💡','Electricity',3000],['un','🪙','Unallocated',500]].map(([id,ic,n,bal],i)=>({id,ic,n,bal,locked:false,c:id==='un'?'#8a96a0':PAL[i%7]})),
  order:['food','personal','data','school','laundry','elec','un'],piggy:1200,goals:[{id:1,n:'School shoes',t:6000,s:1500,i:0,end:60}],locks:[],sched:[],day:0,free:2,ask:'',rev:{bills:0,pos:0,spread:0,pen:0,rw:0,card:0},ob:'welcome',sv:'',open:'',hide:false,hist:{},mv:'',prefs:[{id:900,n:'Pocket money first',for:'piggy',ids:['personal','un']},{id:901,n:'Spare cash',for:'long',ids:['un','personal']}],dsrc:{piggy:'prio',target:'prio',long:'prio'},notif:{sav:true,bills:true,promo:false},ulim:null,pts:0,theme:'',cards:[{id:700,type:'physical',name:'PURPOSEPAY DEBIT',num:'9999123450004821',exp:'10/29',cvv:'318',frozen:false,limit:null,bind:'',status:'active',day:0,spent:0}],cv:'',reveal:0,sas:{on:false,pick:'pct:5',to:'piggy',src:'prio',total:0},us:{st:'idle',t:'',d:{},tries:0},myv:[{code:'WELCOME500',txt:'Welcome gift',kind:'cash',v:500}],vused:[],refc:0,refUsed:false,txs:[],tid:0,tf:'',lastSend:null,user:null,reg:null,upg:false,sub:'piggy',enq:null,tfeat:true,sent:{d:0,a:0},
  mode:'auto',active:'food',log:[],pend:[],seq:1,tab:'home',svc:'',rc:null,pos:'',msg:'',bad:false,feat:true,from:'Aunty Ngozi (UK)'};
const SR=S.b.filter(b=>b.id!=='un').map(b=>({n:b.n,ic:b.ic,amt:b.id==='food'?5000:b.id==='school'?15000:0}));
const NET=['MTN','Airtel','Glo','9mobile'],PLANS=[['1 GB, 7 days',600],['3 GB, 30 days',1500],['10 GB, 30 days',3500]],DISCO=['IBEDC','Ikeja Electric','Eko Electric','Abuja Electric','Enugu Electric'],BETS=['Bet9ja','SportyBet','BetKing'];
const RATES={3:8,6:10,12:12};
const PIG=5,GOAL=7,BANK=12,PEN=0.02,COMM={airtime:2,data:3,elec:1,betting:0,tv:2},EV={1:'day',7:'week',30:'month'};
const BASE=new Date().setHours(0,0,0,0);
const dayStr=d=>new Date(BASE+d*864e5).toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'});
const dayOf=s=>Math.round((new Date(s+'T00:00:00').getTime()-BASE)/864e5);
const iso=d=>{const t=new Date(BASE+d*864e5);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const MERCH=[['Shoprite supermarket','food'],['Mama Put canteen','food'],['MTN data bundle','data'],['Campus laundry','laundry'],['School fees portal','school'],['Fashion boutique','personal'],['Electricity vendor','elec'],['POS agent: cash withdrawal','']];
const LIM={1:50000,2:200000,3:5000000},tierOf=u=>u.bvn?(u.nin?3:2):1;
const BANKS=['PurposePay','Access Bank','GTBank','First Bank','UBA','Zenith Bank','Moniepoint','OPay','Kuda','PalmPay'];
const NAMES=['CHIDINMA OKAFOR','TUNDE ADEBAYO','AMINA BELLO','EMEKA NWOSU','FUNKE AKINTOLA','IBRAHIM MUSA','NGOZI EZE','SEUN BALOGUN'];
const TR=['Food','School','Data','Personal','Laundry','Electricity'].map(n=>{const b=S.b.find(x=>x.n===n);return{n,ic:b?b.ic:'📌',amt:0}});
const CAP=15,PCAP=1000000,CATS={'Rent':'🏠','School fees':'🎓','Travel':'✈️','Emergency':'🛟','Gadget':'💻','Other':'🎯'},PACKS=[['Basic',2500],['Standard',6000],['Premium',15000]];
const lockRate=(mo,a)=>Math.min(CAP,({3:8,6:10,12:12}[mo]||8)+(a>=1e6?3:a>=5e5?2:a>=1e5?1:0));
const limOf=u=>Math.min(LIM[u.tier],S.ulim||Infinity);
const earn=n=>{if(n>0)S.pts+=n};
const get=id=>S.b.find(b=>b.id===id);
const nm=id=>{const b=get(id);return b?b.ic+' '+esc(b.n):'Deleted budget'};
const L=(t,bad,tx)=>{S.log.unshift({t,bad,d:S.day,tx});S.log.length=Math.min(S.log.length,30)};
const say=(m,bad)=>{S.msg=m;S.bad=!!bad};
const val=(f,n)=>(f&&f.querySelector('[name="'+n+'"]')||{}).value||'';
const split=takes=>takes.map(t=>nm(t.id)+' '+N(t.amt)).join(' · ');
const bar=takes=>'<div class="seg">'+takes.map(t=>'<i style="flex:'+t.amt+';background:'+(get(t.id)||{c:'#8a96a0'}).c+'"></i>').join('')+'</div>';
const betIds=()=>S.b.filter(b=>/bet/i.test(b.n)||b.id==='un').map(b=>b.id);
const srcOpt=(sel,ids)=>(ids||S.order).map(i=>{const b=get(i);return '<option value="'+i+'"'+(i===sel?' selected':'')+'>'+b.ic+' '+esc(b.n)+' ('+N(b.bal)+')</option>'}).join('');
const sel=(n,l,a)=>'<label>'+l+'<select name="'+n+'">'+a.map(x=>'<option>'+x+'</option>').join('')+'</select></label>';
const inp=(n,l,ph,x)=>'<label>'+l+'<input name="'+n+'" placeholder="'+ph+'" '+x+'></label>';
const tok=()=>Array.from({length:5},()=>String(1000+Math.floor(Math.random()*9000))).join(' ');

function mk(name,ic){
  const n=clean(name);let b=S.b.find(x=>x.n.toLowerCase()===n.toLowerCase());
  if(b)return b;
  b={id:'c'+(++S.seq),ic:ic||'📌',n,bal:0,locked:false,c:PAL[S.b.length%7]};
  S.b.push(b);S.order.splice(S.order.indexOf('un'),0,b.id);return b;
}
function spend(amt,prim,allowed){
  let need=amt;const takes=[];
  const ids=(prim&&get(prim)?[prim]:[]).concat(S.order.filter(i=>i!==prim));
  for(const id of ids){
    if(need<=0)break;
    if(allowed&&!allowed.includes(id))continue;
    const b=get(id);if(id!==prim&&b.locked)continue;
    const t=Math.min(b.bal,need);if(t>0){takes.push({id,amt:t});need-=t}
  }
  if(need>0)return{ok:false,short:need};
  takes.forEach(t=>get(t.id).bal-=t.amt);
  return{ok:true,takes};
}
function spendIds(amt,ids){let need=amt;const takes=[];for(const id of ids){if(need<=0)break;const b=get(id);if(!b)continue;const t=Math.min(b.bal,need);if(t>0){takes.push({id,amt:t});need-=t}}if(need>0)return{ok:false,short:need};takes.forEach(t=>get(t.id).bal-=t.amt);return{ok:true,takes}}
function runSrc(src,amt){
  if(src==='prio')return spend(amt,'',null);
  if(src.startsWith('pref:')){const p=S.prefs.find(x=>x.id===+src.slice(5));return spendIds(amt,p?p.ids:[])}
  return spendIds(amt,[src]);
}
const srcLabel=src=>src==='prio'?'⭐ my budget priority':src.startsWith('pref:')?'📋 '+esc((S.prefs.find(x=>x.id===+src.slice(5))||{n:'preference'}).n):nm(src);
const savOpt=(kind,sel)=>{const d=sel||S.dsrc[kind]||'prio';return '<option value="prio"'+(d==='prio'?' selected':'')+'>⭐ My budget priority order</option>'+S.prefs.filter(p=>p.for===kind).map(p=>'<option value="pref:'+p.id+'"'+(d==='pref:'+p.id?' selected':'')+'>📋 '+esc(p.n)+'</option>').join('')+srcOpt(d)};
function take(f){
  const a=Math.round(+val(f,'amt')),src=val(f,'src');
  if(!(a>0))return[0,'Enter an amount above ₦0.'];
  if(src!=='prio'&&!src.startsWith('pref:')&&!get(src))return[0,'Pick where the money should come from.'];
  const r=runSrc(src,a);
  if(!r.ok)return[0,(src==='prio'?'Your budget priority order':src.startsWith('pref:')?'That preference':get(src).n)+' has only '+N(a-r.short)+' available.'];
  return[a,'',r.takes];
}
const auto=k=>k==='airtime'||k==='data'?'data':k==='elec'?'elec':k==='tv'?'':((S.b.find(b=>/bet/i.test(b.n))||{}).id||'');

function doPay(f){
  const k=f.dataset.k,v=n=>val(f,n).trim();
  let amt=Math.round(+v('amt'));
  if(k==='data')amt=PLANS[+v('plan')][1];
  if(k==='tv')amt=PACKS[+v('pack')][1];
  const MIN={airtime:50,elec:500,betting:100,data:1,tv:1};
  if((k==='airtime'||k==='data')&&!/^0\d{10}$/.test(v('phone')))return say('Enter an 11-digit phone number starting with 0.',1);
  if(k==='elec'&&!/^\d{11,13}$/.test(v('meter')))return say('Enter your 11 to 13 digit meter number.',1);
  if(k==='betting'&&v('cid').length<4)return say('Enter your betting account ID.',1);
  if(k==='tv'&&!/^\d{10}$/.test(v('card')))return say('Enter your 10-digit smartcard or IUC number.',1);
  if(!(amt>=MIN[k]))return say('The minimum amount is '+N(MIN[k])+'.',1);
  const from=v('from'),r=spend(amt,from==='auto'?auto(k):from,k==='betting'?betIds():null);
  if(!r.ok)return say('Not enough money in the budgets allowed for this payment. Short by '+N(r.short)+'.'+(k==='betting'?' Betting can only use a Betting budget or Unallocated.':''),1);
  let title,lines;
  if(k==='airtime'){title='Airtime sent';lines=[v('net')+' airtime '+N(amt),'To '+esc(v('phone'))]}
  else if(k==='data'){const p=PLANS[+v('plan')];title='Data bundle sent';lines=[v('net')+' '+p[0],'To '+esc(v('phone'))]}
  else if(k==='betting'){title='Betting wallet funded';lines=[v('bet')+' '+N(amt),'Account '+esc(v('cid'))]}
  else if(k==='tv'){title='TV subscription paid';lines=[v('prov')+' '+PACKS[+v('pack')][0]+' '+N(amt),'Smartcard '+esc(v('card'))]}
  else{title='Electricity paid';lines=[v('disco')+' '+v('mt')+' '+N(amt),'Meter '+esc(v('meter'))]}
  S.rc={title,lines,takes:r.takes,token:k==='elec'?tok():''};
  S.rev.bills+=amt*COMM[k]/100;
  earn(Math.floor(amt/200));
  L('<b>'+N(amt)+'</b> '+lines[0]+' paid from '+split(r.takes),0,TX(title,amt,r.takes,'bill'));
  spendSave(amt);
}

function run(t){
  const k=t.dataset.act,id=t.dataset.id,f=t.closest('.frm'),fid=f&&f.dataset.id,a0=()=>Math.round(+val(f,'amt'));
  switch(k){
  case 'svc':S.svc=id;S.rc=null;break;
  case 'done':S.rc=null;S.svc='';S.enq=null;S.tab='home';break;
  case 'pay':f.dataset.k==='tx'?doSend(f):doPay(f);break;
  case 'pig-in':{const[a,e,tk]=take(f);if(e)return say(e,1);S.piggy+=a;earn(Math.floor(a/100));H('piggy','+ '+N(a)+' added');L('Saved <b>'+N(a)+'</b> in 🐷 Piggy bank',0,TX('Saved in Piggy bank',a,tk,'save'));say('Saved '+N(a)+'.');break}
  case 'pig-out':{const a=a0();if(!(a>0&&a<=S.piggy))return say('Enter an amount up to '+N(S.piggy)+'.',1);S.piggy-=a;get('un').bal+=a;H('piggy','− '+N(a)+' withdrawn');L('Took <b>'+N(a)+'</b> out of 🐷 Piggy bank into '+nm('un'));say('Moved to Unallocated.');break}
  case 'goal-new':{const cat=val(f,'cat')||'Other',n=clean(val(f,'n'))||cat,tg=Math.round(+val(f,'t')),end=dayOf(val(f,'end'));if(!n||!(tg>0))return say('Give the goal a name and a target amount.',1);if(!(end>S.day))return say('Pick a target date after today.',1);S.goals.push({id:++S.seq,n,t:tg,s:0,i:0,end,ic:CATS[cat]||'🎯'});H('g'+S.seq,'Target created: '+N(tg)+' by '+dayStr(end));L('Created target <b>'+esc(n)+'</b> of '+N(tg)+' by '+dayStr(end));S.sv='target';break}
  case 'goal-in':{const g=S.goals.find(x=>x.id===+fid),[a,e,tk]=take(f);if(e)return say(e,1);g.s+=a;earn(Math.floor(a/100));H('g'+g.id,'+ '+N(a)+' added');L('Added <b>'+N(a)+'</b> to target '+esc(g.n),0,TX('Added to target '+g.n,a,tk,'save'));say(g.s+g.i>=g.t?'Goal reached! 🎉':'Added '+N(a)+'.');break}

function advance(n){
  let int=0,auto=0,miss=0,mat=0,piI=0;const gi={},li={};
  for(let d=0;d<n;d++){
    S.day++;
    if(S.day%365===0)S.free=2;
    const dep=S.piggy+S.goals.reduce((a,g)=>a+g.s+g.i,0)+S.locks.reduce((a,l)=>a+l.amt,0);
    let paid=Math.min(S.piggy,PCAP)*PIG/100/365;S.piggy+=paid;piI+=paid;
    S.goals.forEach(g=>{const x=(g.s+g.i)*GOAL/100/365;g.i+=x;paid+=x;gi[g.id]=(gi[g.id]||0)+x});
    S.locks.forEach(l=>{if(!l.up){const x=l.amt*l.rate/100/365;l.i+=x;paid+=x;li[l.id]=(li[l.id]||0)+x}});
    S.rev.spread+=dep*BANK/100/365-paid;int+=paid;
    S.sched.forEach(s=>{
      if(s.next>S.day)return;
      const g=s.to==='piggy'?null:S.goals.find(x=>x.id===+s.to),r=(s.to==='piggy'||g)?runSrc(s.src,s.amt):null;
      if(r&&r.ok){if(g)g.s+=s.amt;else S.piggy+=s.amt;auto+=s.amt;earn(Math.floor(s.amt/100));H(s.to==='piggy'?'piggy':'g'+s.to,'Auto-save + '+N(s.amt)+' from '+srcLabel(s.src))}else{miss++;H(s.to==='piggy'?'piggy':'g'+s.to,'Auto-save skipped: not enough money')}
      s.next+=s.every;
    });
    S.locks=S.locks.filter(l=>{if(S.day<l.end)return true;const tot=l.amt+(l.up?0:l.i);get('un').bal+=tot;mat+=tot;return false});
  }
  if(piI>0)H('piggy','Interest + '+N(piI)+' over '+n+' day'+(n>1?'s':''));
  Object.entries(gi).forEach(([id,v])=>H('g'+id,'Interest + '+N(v)));
  Object.entries(li).forEach(([id,v])=>H('l'+id,'Interest + '+N(v)));
  L('⏩ '+n+' day'+(n>1?'s':'')+' passed. Today is '+dayStr(S.day)+'. Interest earned: <b>'+N(int)+'</b>'+(auto?' · Auto-saved '+N(auto):'')+(mat?' · Matured '+N(mat):''));
  if(miss)L('Auto-save skipped '+miss+' time'+(miss>1?'s':'')+': not enough money in the budget',1);
  say('Moved forward '+n+' day'+(n>1?'s':'')+'.');
}

function spendSave(amt){

  const[m,v]=c.pick.split(':'),x=m==='pct'?Math.round(amt*+v/100):Math.ceil(amt/+v)*+v-amt;
  if(x<=0)return;
  const g=c.to==='piggy'?null:S.goals.find(y=>y.id===+c.to);
  if(c.to!=='piggy'&&!g)return;
  const r=runSrc(c.src,x);
  if(!r.ok){L('Spend & Save skipped: not enough money for '+N(x),1);return}
  if(g)g.s+=x;else S.piggy+=x;
  c.total+=x;earn(Math.floor(x/100));H(g?'g'+g.id:'piggy','Spend & Save + '+N(x));
  L('💸 Spend & Save: <b>'+N(x)+'</b> saved into '+(g?esc(g.n):'🐷 Piggy bank'),0,TX('Spend & Save',x,r.takes,'save'));
}

function ussdIn(raw){
  const u=S.us,t=String(raw).trim(),d=u.d,st=u.st,amt=Math.round(+t),to=(s,x)=>{u.st=s;u.t=x},end=m=>to('end',m+'\n\nDial *999# to start again.'),menu=()=>to('main',US_MAIN);
  if(st==='idle'||st==='end'){if(t==='*999#'){u.d={};u.tries=0;menu()}else to('idle','Invalid USSD code. Dial *999# (demo).');return}
  if(st==='main'){
    if(t==='1')return to('bal','Spendable '+N(S.b.reduce((a,b)=>a+b.bal,0))+'\n'+usList()+'\nPiggy bank '+N(S.piggy)+'\n\n0 Back');
    if(t==='2')return to('tx1','Enter account number (10 digits)');
    if(t==='3')return to('air1','Airtime amount (₦50 or more)');
    if(t==='4')return to('m1',usMer());
    if(t==='5')return to('mv1','Move from:\n'+usList());
    if(t==='6')return to('sv1','Amount to save in Piggy bank');
    if(t==='0')return end('Thank you.');
    return to('main','Invalid choice.\n'+US_MAIN);
  }
  if(st==='bal')return menu();
  if(st==='tx1'){if(!/^\d{10}$/.test(t))return to('tx1','Invalid account number.\nEnter account number (10 digits)');d.acct=t;d.name=NAMES[[...t].reduce((a,c)=>a+ +c,0)%NAMES.length];return to('tx2',d.name+'\nEnter amount')}
  if(st==='tx2'){if(!(amt>0))return to('tx2','Invalid amount.\nEnter amount');d.amt=amt;d.kind='tx';return to('pin','Send '+N(amt)+' to '+d.name+'\nEnter your PIN')}
  if(st==='air1'){if(!(amt>=50))return to('air1','Minimum is ₦50.\nAirtime amount');d.amt=amt;d.kind='air';return to('pin','Buy '+N(amt)+' airtime for '+S.user.phone+'\nEnter your PIN')}
  if(st==='m1'){const i=+t-1001;if(!(i>=0&&i<7))return to('m1','Invalid code.\n'+usMer());d.m=i;return to('m2',MERCH[i][0]+'\nEnter amount')}
  if(st==='m2'){if(!(amt>0))return to('m2','Invalid amount.\nEnter amount');d.amt=amt;d.kind='m';return to('pin','Pay '+N(amt)+' to '+MERCH[d.m][0]+'\nEnter your PIN')}
  if(st==='mv1'){const i=+t-1;if(!S.order[i])return to('mv1','Invalid choice.\nMove from:\n'+usList());d.from=S.order[i];return to('mv2','Move to:\n'+usList())}
  if(st==='mv2'){const i=+t-1;if(!S.order[i]||S.order[i]===d.from)return to('mv2','Choose a different budget.\nMove to:\n'+usList());d.to=S.order[i];return to('mv3','Amount to move from '+get(d.from).n+' to '+get(d.to).n)}
  if(st==='mv3'){const a=get(d.from),b=get(d.to);if(!(amt>0&&amt<=a.bal))return to('mv3','Invalid amount. '+a.n+' has '+N(a.bal)+'.\nAmount');a.bal-=amt;b.bal+=amt;L('📟 USSD: moved <b>'+N(amt)+'</b> from '+nm(a.id)+' to '+nm(b.id));return end('Moved '+N(amt)+' from '+a.n+' to '+b.n+'.')}
  if(st==='sv1'){if(!(amt>0))return to('sv1','Invalid amount.\nAmount to save');d.amt=amt;d.kind='sv';return to('pin','Save '+N(amt)+' in Piggy bank\nEnter your PIN')}
  if(st==='pin'){
    if(t!==S.user.pin){u.tries++;return u.tries>=3?end('Too many wrong PIN attempts.'):to('pin','Wrong PIN. Try again.\nEnter your PIN')}
    const a=d.amt;
    if(d.kind==='tx'){if(S.sent.d!==S.day)S.sent={d:S.day,a:0};if(S.sent.a+a>limOf(S.user))return end('Over your daily limit of '+N(limOf(S.user))+'.');const r=spend(a,'',null);if(!r.ok)return end('Failed. Your budgets are short by '+N(r.short)+'.');S.sent.a+=a;L('📟 USSD: <b>'+N(a)+'</b> sent to '+esc(d.name)+', paid from '+split(r.takes),0,TX('USSD transfer to '+d.name,a,r.takes,'send'));spendSave(a);return end('Sent '+N(a)+' to '+d.name+'.')}
    if(d.kind==='air'){const r=spend(a,auto('airtime'),null);if(!r.ok)return end('Failed. Your budgets are short by '+N(r.short)+'.');S.rev.bills+=a*COMM.airtime/100;earn(Math.floor(a/200));L('📟 USSD: <b>'+N(a)+'</b> airtime paid from '+split(r.takes),0,TX('USSD airtime',a,r.takes,'bill'));spendSave(a);return end('Airtime of '+N(a)+' sent.')}
    if(d.kind==='m'){const m=MERCH[d.m],p=S.mode==='auto'?m[1]:S.mode==='active'?S.active:'',r=spend(a,p,null);if(!r.ok)return end('Declined. Your budgets are short by '+N(r.short)+'.');if(m[1])S.rev.pos+=a*0.005;L('📟 USSD: <b>'+N(a)+'</b> at '+m[0]+' paid from '+split(r.takes),0,TX('USSD payment: '+m[0],a,r.takes,'card'));spendSave(a);return end('Paid '+N(a)+' to '+m[0]+'.')}
    const r=runSrc(S.dsrc.piggy||'prio',a);if(!r.ok)return end('Failed. Not enough money in your chosen budgets.');S.piggy+=a;earn(Math.floor(a/100));H('piggy','+ '+N(a)+' added (USSD)');L('📟 USSD: saved <b>'+N(a)+'</b> in 🐷 Piggy bank');return end('Saved '+N(a)+' in Piggy bank.');
  }
}
